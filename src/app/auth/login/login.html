<div class="min-h-screen flex items-center rounded-4xl justify-center bg-stone-100 p-4 sm:p-6">
  <div
    class="w-full max-w-2xl max-h-130 flex md:flex-row rounded-2xl shadow-xl overflow-hidden border border-amber-900/10"
  >
    <div
      class="w-full md:w-1/2 bg-[#EFF6FF] p-8 flex flex-col items-center justify-center text-center border-b md:border-b-0 md:border-r border-[#00838F]/20"
    >
      <div class="flex flex-col gap-0">
        <mat-icon class="text-4xl! w-auto! h-auto!">diversity_2_sharp</mat-icon>
        <h1 class="text-3xl font-extrabold">LeaveFlow</h1>
      </div>

      <p class="text-sm text-blue-700 font-medium italic max-w-xs mt-7">
        Streamline leave requests and team management in one unified workspace.
      </p>

      <div class="w-full flex-1 flex items-center justify-center overflow-hidden">
        <img
          src="/assets/images/login.png"
          alt="Employee working at a desk"
          class="w-[200%] max-w-none h-auto object-contain"
        />
      </div>
    </div>

    <div class="w-full md:w-1/2 bg-white sm:p-10 flex flex-col justify-center">
      <form [formGroup]="LoginForm" class="space-y-6">
        <div class="space-y-1 text-center">
          <h2 class="text-2xl font-bold text-stone-900">Welcome back</h2>
          <p class="text-sm text-stone-500">Please enter your details to sign in</p>
        </div>

        <div class="space-y-4">
          <div class="space-y-1.5">
            <label class="block text-sm font-medium text-stone-700">Email</label>
            <input
              type="text"
              formControlName="email"
              placeholder="Enter your Email"
              class="w-full px-4 py-2.5 rounded-lg border border-stone-300 bg-stone-50 text-stone-900 placeholder-stone-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-transparent transition-all duration-200"
            />
          </div>

          <div class="space-y-1.5">
            <label class="block text-sm font-medium text-stone-700">Password</label>
            <input
              type="password"
              formControlName="password"
              placeholder="••••••••"
              class="w-full px-4 py-2.5 rounded-lg border border-stone-300 bg-stone-50 text-stone-900 placeholder-stone-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:border-transparent transition-all duration-200"
            />
          </div>
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 px-6 py-3 text-white rounded-lg hover:bg-blue-700 font-medium text-sm transition-all duration-200 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-[#2563EB] focus:ring-offset-2 active:scale-[0.99]"
        >
          Log In
        </button>
      </form>
    </div>
  </div>
</div>
