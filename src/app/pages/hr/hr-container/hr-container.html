<div class="flex h-screen w-full overflow-hidden bg-slate-50">
  <app-hr-sidebar #sidebar class="transition-all duration-300"></app-hr-sidebar>

  <div class="relative flex min-w-0 flex-1 flex-col overflow-hidden">
    <!-- Top Action Bar (Standalone Bell Icon & Mobile Toggle) -->
    <div class="flex items-center justify-between border-b border-slate-100 bg-white px-4 py-3 sm:px-6 lg:justify-end">
      <button
        (click)="sidebar.toggleMobileSidebar()"
        class="flex h-10 w-10 items-center justify-center rounded-xl bg-[#0d1d3e] text-white hover:bg-[#313d5b] focus:outline-none lg:hidden"
        aria-label="Toggle Navigation Menu"
      >
        <mat-icon class="flex! h-6! w-6! items-center justify-center leading-none text-white"
          >menu</mat-icon
        >
      </button>

      <!-- Standalone Top-Right Notification Bell Icon -->
      <app-notification-bell role="HR"></app-notification-bell>
    </div>

    <main class="min-w-0 flex-1 overflow-y-auto bg-white p-4 lg:p-8 2xl:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
