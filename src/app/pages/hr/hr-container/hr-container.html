<div class="flex h-screen w-full overflow-hidden bg-slate-50">
  <app-hr-sidebar #sidebar class="transition-all duration-300"></app-hr-sidebar>

  <div class="flex min-w-0 flex-1 flex-col overflow-hidden">
    <header
      class="flex h-16 items-center border-b border-[#68a7f5]/30 bg-[#0d1d3e] px-4 text-white lg:hidden"
    >
      <button
        (click)="sidebar.toggleMobileSidebar()"
        class="flex h-10 w-10 items-center justify-center rounded-lg text-white hover:bg-[#313d5b] focus:outline-none"
        aria-label="Toggle Navigation Menu"
      >
        <mat-icon class="flex! h-6! w-6! items-center justify-center leading-none text-white"
          >menu</mat-icon
        >
      </button>
      <span class="ml-2 text-base font-bold text-[#68a7f5]">LeaveFlow</span>
    </header>

    <main class="min-w-0 flex-1 overflow-y-auto bg-white lg:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
